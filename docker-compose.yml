services:
  db:
    image: postgres:16-alpine
    container_name: extension-blocker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-extension_blocker}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-extension_blocker}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
